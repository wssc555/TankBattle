# 客户端进程配置（ClientConfig.load 读取；命令行 --host/--port/--charset/--fps 覆盖）
client.net.host=127.0.0.1
client.net.port=9999
# 默认 UTF-8；对接 GBK 编码服务端时设为 GBK
client.net.charset=UTF-8
client.render.fps=60
client.input.hz=30
client.render.interpolation=true
client.net.connectTimeoutMs=3000
client.net.idleTimeoutMs=5000
client.net.reconnectBaseMs=500
client.net.reconnectMaxMs=8000
client.net.reconnectMaxAttempts=6
client.net.maxFrameChars=16384
client.net.frameQueueCapacity=64
# 方向键互斥；false 时允许多方向叠加
client.input.exclusiveDirection=true
