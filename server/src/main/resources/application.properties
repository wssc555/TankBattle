# 服务端可配置项（GameConfig.Runtime 读取；缺省时使用内置默认值）
server.port=9999
server.frameMs=30
# 增量同步：默认关闭。开启后对完成 v2 握手（V2;/v2;）的客户端追加 d{seq}; 指令；
# 未完成握手的客户端始终收到 v1 全量帧
net.incremental=false
# 会话收发字符集：默认 UTF-8；对接 GBK 编码客户端时设为 GBK
net.charset=UTF-8
# 道具护盾/冻结时长：true 为固定 300 帧，false 为 300~699 帧随机
powerup.classicRoll=true
# 结束投票超时（秒），仅用于主机已投票、客户端迟迟不响应的情况
flow.voteTimeoutSeconds=30
# 单帧耗时告警阈值（毫秒）
log.slowFrameWarnMs=5
