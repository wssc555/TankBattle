name: Build JARs

# tag 推送立即自动构建；也支持在 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package server & client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        shell: bash
        run: |
          set -euo pipefail
          # -T 1C：多核并行构建 reactor 模块（common 先行，server/client 并行）
          # maven.test.skip 连 test-compile 一起跳过，纯打包不跑测试
          mvn -B -ntp -T 1C -Dmaven.test.skip=true -pl server,client -am package

      - name: Collect fat jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # shade 会留下 original-*.jar 与 *-shaded.jar 中间产物，只取最终可执行 fat jar
          for module in server client; do
            candidates=()
            for jar in "$module"/target/*.jar; do
              [[ -f "$jar" ]] || continue
              case "$(basename "$jar")" in
                original-*|*-shaded.jar) continue ;;
              esac
              candidates+=("$jar")
            done
            if [[ ${#candidates[@]} -ne 1 ]]; then
              echo "::error::expected exactly 1 fat jar for $module, got ${#candidates[@]}: ${candidates[*]}"
              exit 1
            fi
            cp "${candidates[0]}" "dist/$module.jar"
          done
          ls -lh dist
          sha256sum dist/server.jar dist/client.jar > dist/SHA256SUMS.txt

      - name: Job summary
        shell: bash
        run: |
          {
            echo "### 构建产物"
            echo ""
            echo "| JAR | 大小 | SHA256 |"
            echo "| --- | --- | --- |"
            for jar in dist/server.jar dist/client.jar; do
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$jar")" \
                "$(du -h "$jar" | cut -f1)" \
                "$(sha256sum "$jar" | cut -d' ' -f1)"
            done
            echo ""
            echo "运行：\`java -jar server.jar \` / \`java -jar client.jar\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tank-battle-jars-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          # Actions 产物上限 90 天；tag 构建会额外发布到 Release 永久保存
          retention-days: 90
          # jar 已是压缩格式，跳过 zip 二次压缩
          compression-level: 0

      # tag 构建产物发布到 GitHub Release，永久保存
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Release 已存在时仅覆盖上传附件
            gh release upload "$TAG" --clobber dist/server.jar dist/client.jar dist/SHA256SUMS.txt
          else
            gh release create "$TAG" \
              --title "Tank Battle $TAG" \
              --generate-notes \
              dist/server.jar dist/client.jar dist/SHA256SUMS.txt
          fi
